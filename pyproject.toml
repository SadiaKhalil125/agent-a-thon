[project]
name = "companytwin-ai"
version = "0.1.0"
description = "CompanyTwin AI — organizational digital twin (SSI Agent-A-Thon 2026)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
files = ["twin", "agents", "orchestration", "api", "config.py", "app.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
